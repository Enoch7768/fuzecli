name: CI

on:
  push:
    branches:
      - main
      - public-release-hardening
      - phase1-agent-foundation
      - phase2-code-intelligence
      - phase3-debug-test-git
      - phase4-final-polish
      - phase5-agent-engine
      - phase6-command-security
      - phase7-transaction-engine
      - phase8-provider-conformance
      - phase9-true-streaming
      - phase10-provider-capabilities
      - phase11-intelligent-routing
      - phase12-provider-telemetry
      - final-apex-production-hardening
      - production-hardening-2026-09
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Git line endings
        shell: pwsh
        run: |
          git config core.autocrlf false
          git checkout -- .
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Verify modules
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate Studio JavaScript
        run: node --check internal/api/web/app.js
      - name: Test
        run: go test ./...
      - name: Run deterministic agent evaluation harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          go test -v ./internal/agent -run TestDeterministicAgentEvaluationHarness 2>&1 | Tee-Object -FilePath artifacts/agent-evaluation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload agent evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-go-${{ matrix.go-version }}
          path: artifacts/agent-evaluation.log
          if-no-files-found: ignore
      - name: Race-sensitive package tests
        if: matrix.go-version == '1.26.x'
        run: go test -count=1 ./internal/api ./internal/intelligence ./internal/generation ./internal/provider
      - name: Vet
        run: go vet ./...
      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w" -o dist/aicli.exe ./cmd/aicli
      - name: Smoke test
        shell: pwsh
        run: |
          & .\dist\aicli.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\aicli.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate Studio JavaScript
        run: node --check internal/api/web/app.js
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CGO-free macOS binary
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o dist/aicli ./cmd/aicli
      - name: Smoke test
        run: |
          ./dist/aicli version
          ./dist/aicli --help
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan dependencies and code
        run: govulncheck ./...
