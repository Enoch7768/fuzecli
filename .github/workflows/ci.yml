name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Tidy modules
        shell: pwsh
        run: |
          go mod tidy
          Write-Host '--- go.mod ---'
          Get-Content go.mod
          Write-Host '--- go.sum ---'
          Get-Content go.sum
      - name: Test
        run: go test ./...
      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w" -o dist/aicli.exe ./cmd/aicli
