name: Format maintenance

on:
  push:
    branches:
      - phase4-final-polish

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Format Go source
        run: gofmt -w .
      - name: Tidy Go modules
        run: go mod tidy
      - name: Commit normalized source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting or module changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go' go.mod go.sum
          git commit -m 'chore: normalize Go formatting and modules'
          git push
