name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: amd64
            suffix: .exe
          - runner: ubuntu-latest
            platform: linux
            arch: amd64
            suffix: ''
          - runner: ubuntu-latest
            platform: linux
            arch: arm64
            suffix: ''
          - runner: macos-latest
            platform: darwin
            arch: arm64
            suffix: ''
          - runner: macos-latest
            platform: darwin
            arch: amd64
            suffix: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - name: Verify modules
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CGO-free binary
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.platform == 'darwin' && 'darwin' || matrix.platform }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          name="aicli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name" ./cmd/aicli
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
      - name: Smoke test native binary
        shell: bash
        run: |
          if [ "$(go env GOARCH)" != "${{ matrix.arch }}" ]; then echo "Skipping execution of cross-architecture binary"; exit 0; fi
          ./dist/aicli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }} version
          ./dist/aicli-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.suffix }} --help
      - name: Upload platform assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
