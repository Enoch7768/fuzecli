name: Release Windows build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Verify formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            Write-Host "The following files are not gofmt-formatted:"
            $files
            exit 1
          }
      - name: Verify modules
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/aicli.exe ./cmd/aicli
      - name: Smoke test
        shell: pwsh
        run: |
          & .\dist\aicli.exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\aicli.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\aicli.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  aicli.exe" | Set-Content -NoNewline dist\aicli.exe.sha256
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/aicli.exe
            dist/aicli.exe.sha256
