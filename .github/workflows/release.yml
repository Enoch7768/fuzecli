name: Release Windows build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test
        run: go test ./...
      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/aicli.exe ./cmd/aicli
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aicli.exe
